<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" width="1200" height="520">
  <title>Unternehmensdaten bleiben im eigenen Haus</title>
  <desc>Links ein Gebäude, in dem Unterlagen, Wissensbasis und Sprachmodell miteinander verbunden sind und die Daten in einem geschlossenen Kreis zirkulieren. Rechts eine ausgegraute Cloud eines Anbieters im Drittland, die Verbindung dorthin ist unterbrochen.</desc>

  <defs>
    <style>
      .t { font-family: Inter, system-ui, -apple-system, sans-serif; }
      .cap { font-size: 15px; letter-spacing: 1.6px; }
      .lbl { font-size: 19px; font-weight: 500; }
      .sub { font-size: 15px; }

      /* Kompaktfassung: erscheint erst, wenn die Grafik klein dargestellt wird */
      .compact { display: none; }

      /* Media Queries beziehen sich hier auf die Anzeigegröße der Grafik,
         nicht auf das Browserfenster. Unterhalb von ~560px würden die
         Detailbeschriftungen auf Briefmarkengröße schrumpfen — deshalb
         treten dann zwei große Labels an ihre Stelle. Die vollständige
         Erklärung steht ohnehin in der Bildunterschrift. */
      @media (max-width: 560px) {
        .detail  { display: none; }
        .compact { display: block; }
      }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#C8A96A"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="#F2EFE9"/>

  <!-- ══ Linke Seite: das eigene Haus ══ -->
  <g>
    <path d="M70 176 L360 60 L650 176" fill="none" stroke="#3A3631" stroke-width="3"
          stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="70" y="176" width="580" height="284" rx="14" fill="#FAF8F5" stroke="#3A3631" stroke-width="3"/>

    <text x="102" y="222" class="t cap detail" fill="#7C766C">IHR HAUS</text>

    <!-- Unterlagen -->
    <rect x="102" y="248" width="164" height="60" rx="9" fill="#fff" stroke="#3A3631" stroke-opacity=".16"/>
    <rect x="118" y="266" width="92" height="7" rx="3.5" fill="#3A3631" fill-opacity=".5"/>
    <rect x="118" y="282" width="126" height="6" rx="3" fill="#3A3631" fill-opacity=".2"/>
    <text x="118" y="336" class="t sub detail" fill="#5F5952">Unterlagen</text>

    <!-- Wissensbasis -->
    <rect x="290" y="248" width="142" height="60" rx="9" fill="#fff" stroke="#3A3631" stroke-opacity=".16"/>
    <ellipse cx="361" cy="268" rx="34" ry="8" fill="none" stroke="#3A3631" stroke-opacity=".45" stroke-width="2"/>
    <path d="M327 268v18c0 4.4 15.2 8 34 8s34-3.6 34-8v-18" fill="none" stroke="#3A3631"
          stroke-opacity=".45" stroke-width="2"/>
    <text x="306" y="336" class="t sub detail" fill="#5F5952">Wissensbasis</text>

    <!-- Modell auf eigener Hardware -->
    <rect x="456" y="248" width="142" height="60" rx="9" fill="#fff" stroke="#3A3631" stroke-opacity=".16"/>
    <rect x="486" y="262" width="82" height="10" rx="5" fill="#3A3631" fill-opacity=".18"/>
    <rect x="486" y="278" width="82" height="10" rx="5" fill="#3A3631" fill-opacity=".18"/>
    <circle cx="497" cy="267" r="3.5" fill="#2D7A4F"/>
    <circle cx="497" cy="283" r="3.5" fill="#2D7A4F"/>
    <text x="470" y="336" class="t sub detail" fill="#5F5952">Modell</text>

    <!-- geschlossener Kreislauf -->
    <path d="M150 372 H556" fill="none" stroke="#C8A96A" stroke-width="2.5" marker-end="url(#ar)"/>
    <path d="M150 372 q-34 0 -34 26 t34 26 H556 q34 0 34 -26 t-34 -26" fill="none"
          stroke="#C8A96A" stroke-width="2.5" stroke-opacity=".45"/>
    <text x="230" y="418" class="t sub detail" fill="#7C766C">Anfrage und Antwort bleiben im Haus</text>

    <!-- Kompaktfassung -->
    <text x="360" y="410" class="t compact" font-size="52" font-weight="500"
          text-anchor="middle" fill="#3A3631">Im Haus</text>
  </g>

  <!-- ══ Grenze ══ -->
  <line x1="712" y1="52" x2="712" y2="468" stroke="#3A3631" stroke-opacity=".22"
        stroke-width="2" stroke-dasharray="7 9"/>

  <!-- ══ Rechte Seite: Drittland ══ -->
  <g opacity=".72">
    <path d="M812 232 a46 46 0 0 1 88 -18 a38 38 0 0 1 66 22 a40 40 0 0 1 -8 78 H830
             a44 44 0 0 1 -18 -82 z"
          fill="#E8E3DC" stroke="#7C766C" stroke-width="2.5" stroke-dasharray="8 7"/>
    <text x="812" y="368" class="t lbl detail" fill="#5F5952">Anbieter im Drittland</text>
    <text x="812" y="396" class="t sub detail" fill="#7C766C">Zugriff nach fremdem Recht</text>

    <!-- Kompaktfassung -->
    <text x="893" y="410" class="t compact" font-size="52" font-weight="500"
          text-anchor="middle" fill="#5F5952">Extern</text>
  </g>

  <!-- unterbrochene Verbindung -->
  <path d="M650 300 H770" fill="none" stroke="#C0392B" stroke-opacity=".55" stroke-width="2.5"
        stroke-dasharray="9 8"/>
  <g transform="translate(710 300)">
    <circle r="19" fill="#FAF8F5" stroke="#C0392B" stroke-opacity=".55" stroke-width="2"/>
    <path d="M-7 -7 L7 7 M7 -7 L-7 7" stroke="#C0392B" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>
